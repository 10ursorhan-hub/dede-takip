name: APK derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: SDK bileşenleri
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: APK derle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK'yı adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk dede-takip.apk

      - name: Release'e yükle (sabit indirme linki)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surum
          name: Dede Takip — kurulum dosyası
          body: "Dedenin telefonunda bu sayfadaki dede-takip.apk dosyasını indirip kurun."
          files: dede-takip.apk
