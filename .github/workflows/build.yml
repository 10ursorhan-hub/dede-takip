name: APK derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest sunucusunda Android SDK zaten kurulu gelir (ANDROID_SDK_ROOT/ANDROID_HOME).
      - name: local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties

      - name: Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Sabit imza anahtarı (secret varsa)
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > app/dede.keystore && echo "sabit imza aktif"; else echo "secret yok; geçici imza ile derlenecek"; fi

      - name: APK derle
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK'yı adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk dede-takip.apk

      - name: Release'e yükle (sabit indirme linki)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surum
          name: Dede Takip — kurulum dosyası
          body: "Dedenin telefonunda bu sayfadaki dede-takip.apk dosyasını indirip kurun."
          files: dede-takip.apk
